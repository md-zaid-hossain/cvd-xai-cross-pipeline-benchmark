# Conda alternative to the pip requirements files.
#
#   conda env create -f environment/environment.yml
#   conda activate cvd-xai
#
# This installs the full correction/reproduction stack (Level 2-3 in
# docs/REPRODUCIBILITY.md). For verification only (Level 1), the lighter
# environment/requirements-verify.txt is sufficient and faster.
#
# The pinned versions below mirror environment/requirements-corrections.txt.
# PyTorch is installed CPU-only here; for GPU, replace the `cpuonly` line with
# the appropriate `pytorch-cuda=<version>` package for your driver, per
# https://pytorch.org/get-started/locally/
name: cvd-xai
channels:
  - pytorch
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy=2.3.5
  - pandas=2.2.3
  - scipy>=1.13
  - scikit-learn=1.8.0
  - matplotlib>=3.9
  - pytorch=2.10.0
  - cpuonly
  - pip:
      - xgboost==3.1.3
      - lightgbm==4.6.0
      - catboost==1.2.8
      - shap==0.50.0
