name: Validate release

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: environment/requirements-verify.txt
      - run: python -m pip install -r environment/requirements-verify.txt
      - run: python tools/verify_release.py
